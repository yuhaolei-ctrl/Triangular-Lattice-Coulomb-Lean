# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The triangular lattice minimizes the two-dimensional Coulomb renormalized energy"
  description: >-
    A Lean 4 formalization, against Mathlib, of the crystallization theorem for the renormalized
    energy W of Sandier and Serfaty: for discs or squares and every cutoff width L > 0, every
    vector field E in the plane with div E = 2 pi (sum of unit point charges - 1), curl E = 0 and
    bounded density satisfies W_U(E) >= W_U(E_Lambda) = pi R_Lambda, where Lambda is the triangular
    lattice of covolume one, E_Lambda its canonical field and R_Lambda the Robin constant of the
    triangular torus. The proof combines a rigidity theorem for linear-programming auxiliary
    functions, a finite certificate in interval arithmetic, and a screening argument passing from
    periodic configurations to arbitrary fields.
  authors:
    - "Yuhao Lei"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Yuhao Lei"

classification:
  arxiv: ["math-ph", "math.AP", "math.MG"]
  msc2020: ["82B05", "82D55", "35Q56", "52C17", "11H31"]

sources:
  - title: "The triangular lattice minimizes the two-dimensional Coulomb renormalized energy"
    authors:
      - "Yuhao Lei"
    type: "manuscript"
    relationship: "formalizes"
    location: "Theorem 1.1"
    note: >-
      The author's manuscript (version v2). The compared statements are its Theorem 1.1, split into
      the existence of the canonical field and of the Green function, the value W_U(E_Lambda) =
      pi R_Lambda and the lower bound. Deviations in the internal route are listed under
      fidelity.divergences.
    license: "unknown"
    author_endorsement: "participated"
  - title: "From the Ginzburg-Landau model to vortex lattice problems"
    authors:
      - "Etienne Sandier"
      - "Sylvia Serfaty"
    id: "Comm. Math. Phys. 313 (2012), 635-743"
    type: "paper"
    relationship: "background"
    note: >-
      Defines the renormalized energy W and proves the periodic approximation used in Section 11 of
      the manuscript; the formalization proves the needed screening statement directly.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    Work in progress. Challenge.lean states Theorem 1.1 in full. The development is being written;
    no compared statement is proved yet.
  sorry_count: 4
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        Statement design, formalization plan, redesign of the finite certificate and the Lean
        development, by Claude Code agents under the author's direction.
      cost:
        wall_time: "in progress (October 2026)"
        spend_usd: "subscription-based"
        hardware: "local machine for Lean builds, API-only for inference"
      prompting_notes: >-
        Human-directed; the author required that Challenge.lean state Theorem 1.1 of the manuscript
        in full, including the passage from periodic to arbitrary fields.
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: "Human direction, the mathematics of the manuscript, and the choice of statement."
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "subscription-based; not separately tracked"
  notes: >-
    The mathematics is the author's. AI agents assist with the Lean formalization under the author's
    direction; no AI system is listed as an author.

fidelity:
  divergences: >-
    The canonical field and the Green function of the triangular torus are characterized by their
    defining properties (Definition 2.3 and equation (2.3) of the manuscript) instead of being
    constructed in the statement. The internal construction of the auxiliary function and the
    finite certificate will differ from Section 10 of the manuscript so that the computation can be
    checked by Lean's kernel; the details will be recorded here.

review:
  status: "unreviewed"
  reviewers: []
  notes: "The statement is under review by the author."

alignment:
  namespace: "TriangularLattice"
  statements:
    - source: "Theorem 1.1, existence of the canonical field E_Lambda (Definition 2.3)"
      lean: "TriangularLattice.exists_isCanonicalField"
      module: "Solution"
      status: "stated"
      note: "Compared declaration."
    - source: "Theorem 1.1, existence of the Green function of the triangular torus (2.3)"
      lean: "TriangularLattice.exists_isGreenFunction"
      module: "Solution"
      status: "stated"
      note: "Compared declaration."
    - source: "Theorem 1.1, W_U(E_Lambda) = pi R_Lambda"
      lean: "TriangularLattice.energyPerArea_canonicalField"
      module: "Solution"
      status: "stated"
      note: "Compared declaration."
    - source: "Theorem 1.1, W_U(E) >= W_U(E_Lambda) for every admissible field"
      lean: "TriangularLattice.energyPerArea_canonicalField_le"
      module: "Solution"
      status: "stated"
      note: "Compared declaration; the main result."

acknowledgements: >-
  Built on Lean 4 and Mathlib and checked with Lean's Comparator.
